name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      make_latest:
        description: 'Make this build the LATEST release (instead of Pre-Release)'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - 'main'
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Signing Keystore and Google Services
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            echo "Used secret KEYSTORE_BASE64"
          else
            echo "KEYSTORE_BASE64 secret not found, generating runner release keystore..."
            keytool -genkeypair -v -keystore keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias reality_key -storepass realitypass -keypass realitypass -dname "CN=Reality, OU=Reality, O=Reality, L=City, S=State, C=US"
          fi

          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "Used secret GOOGLE_SERVICES_JSON_BASE64"
          elif [ ! -f "app/google-services.json" ]; then
            echo "Creating fallback google-services.json..."
            cat << 'EOF' > app/google-services.json
            {
              "project_info": {
                "project_number": "123456789",
                "project_id": "reality-project",
                "storage_bucket": "reality-project.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:123456789:android:abcdef",
                    "android_client_info": {
                      "package_name": "com.neubofy.reality"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [
                    {
                      "current_key": "sample_api_key"
                    }
                  ],
                  "services": {
                    "analytics_service": {
                      "status": 1
                    }
                  }
                }
              ],
              "configuration_version": "1"
            }
            EOF
          fi

      - name: Configure local.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          AI_URL: ${{ secrets.AI_URL }}
          NOTIFICATION_WORKER_URL: ${{ secrets.NOTIFICATION_WORKER_URL }}
        run: |
          touch local.properties
          echo "KEYSTORE_FILE=keystore.jks" >> local.properties
          echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-realitypass}" >> local.properties
          echo "KEY_ALIAS=${KEY_ALIAS:-reality_key}" >> local.properties
          echo "KEY_PASSWORD=${KEY_PASSWORD:-realitypass}" >> local.properties
          echo "WORKER_URL=$WORKER_URL" >> local.properties
          echo "AI_URL=$AI_URL" >> local.properties
          echo "NOTIFICATION_WORKER_URL=$NOTIFICATION_WORKER_URL" >> local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Extract Version Name
        id: version
        run: |
          VERSION_NAME=$(grep -E 'versionName\s*=\s*".*"' app/build.gradle.kts | sed -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "Extracted version: $VERSION_NAME"

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK to Artifacts (Output)
        uses: actions/upload-artifact@v4
        with:
          name: Reality-APK
          path: app/build_v4/outputs/apk/release/*.apk

      - name: Create Release & Upload APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAKE_LATEST: ${{ github.event.inputs.make_latest || 'false' }}
        run: |
          APK_PATH=$(find app/build_v4/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found APK at $APK_PATH"
          
          if [ "$MAKE_LATEST" = "true" ]; then
            TARGET_TAG="v${VERSION_NAME}"
          else
            TARGET_TAG="v${VERSION_NAME}-beta"
          fi
          echo "Target tag: $TARGET_TAG"
          
          if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
            echo "Checking existing APK assets in release/pre-release $TARGET_TAG..."
            gh release view "$TARGET_TAG" --json assets --jq '.assets[] | select(.name | endswith(".apk")) | "\(.name) \(.downloadCount)"' | while read -r name count; do
              if [ -n "$name" ]; then
                echo "Found existing APK asset: $name with download count: $count"
                if [ "$count" -lt 5 ]; then
                  echo "Download count is less than 5. Deleting $name..."
                  gh release delete-asset "$TARGET_TAG" "$name" -y
                else
                  echo "Download count is $count (5 or more). Keeping $name."
                fi
              fi
            done
            echo "Uploading new APK to $TARGET_TAG..."
            gh release upload "$TARGET_TAG" "$APK_PATH"
          else
            echo "Release $TARGET_TAG does not exist. Creating..."
            if [ "$MAKE_LATEST" = "true" ]; then
              gh release create "$TARGET_TAG" "$APK_PATH" \
                --title "Release $TARGET_TAG" \
                --notes "Automated production release via GitHub Actions."
            else
              gh release create "$TARGET_TAG" "$APK_PATH" \
                --title "Pre-Release $TARGET_TAG" \
                --notes "Automated early access build via GitHub Actions." \
                --prerelease
            fi
          fi
